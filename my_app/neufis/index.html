<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5f7388" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="捏欧菲斯" />
    <title>捏欧菲斯</title>
    <link rel="icon" href="assets/pig-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login" class="login-screen">
      <section class="login-card">
        <img src="assets/pig-icon.svg" alt="捏欧菲斯图标" class="login-logo" />
        <h1>捏欧菲斯</h1>
        <p>私人综合工作台</p>
        <label for="passcode">动态验证码</label>
        <div class="login-row">
          <input id="passcode" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入验证码" />
          <button id="loginBtn">进入</button>
        </div>
        <p id="loginError" class="error-text" aria-live="polite"></p>
      </section>
    </div>

    <main id="app" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/pig-icon.svg" alt="" />
          <div class="brand-copy">
            <strong>捏欧菲斯</strong>
            <span>私人工作台</span>
          </div>
          <button
            id="settingsBtn"
            class="icon-button settings-toggle"
            type="button"
            aria-label="打开设置"
            aria-controls="settingsMenu"
            aria-expanded="false"
            title="设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <nav id="moduleNav" class="module-nav" aria-label="模块导航"></nav>
        <div id="settingsMenu" class="sidebar-actions" aria-label="工作台设置">
          <span class="settings-title">设置</span>
          <button id="installBtn" class="hidden">安装到手机</button>
          <button id="overviewBtn">工作台总览</button>
          <button id="exportExcelBtn">导出 Excel</button>
          <label class="file-button">
            导入 Excel
            <input id="importFile" type="file" accept=".xls,.html,.json,.txt" />
          </label>
        </div>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <h2 id="moduleTitle">工作台总览</h2>
            <p id="moduleSubtitle">记录长期留存，可编辑、删除、导出、复盘。</p>
          </div>
          <button id="lockBtn" class="icon-button" type="button" aria-label="锁定工作台" title="锁定工作台">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </button>
        </header>

        <section class="command-panel">
          <label for="quickInput">随手记 / 指令</label>
          <div class="command-row">
            <textarea id="quickInput" rows="3" placeholder="例如：70.5 / 支出 26 餐饮 午饭 / 健康周报 / 新增读书模块"></textarea>
            <button id="quickSubmit">执行</button>
          </div>
          <div class="quick-tags">
            <button data-command="健康周报">健康周报</button>
            <button data-command="健康月报">健康月报</button>
            <button data-command="月度账单">月度账单</button>
            <button data-command="仅未完成事项">仅未完成事项</button>
            <button data-command="导出全部记录">导出全部记录</button>
            <button data-command="清空本条记录">清空本条记录</button>
          </div>
        </section>

        <section id="moduleContent" class="module-content"></section>
        <section class="output-panel">
          <div class="panel-heading">
            <h3>输出</h3>
            <button id="copyOutputBtn">复制</button>
          </div>
          <pre id="outputBox">等待记录或指令。</pre>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
